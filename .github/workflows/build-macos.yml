name: Build macOS (.dmg)

on:
  push:
    branches: [main, feature/iris-studio-v1]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version à publier en release (ex. v1.0.0) — vide = pas de release'
        required: false
        default: ''
      runner:
        description: 'Machine GitHub (macos-15-intel si les Mac Apple Silicon sont saturés)'
        required: false
        default: 'macos-latest'

permissions:
  contents: write

jobs:
  build:
    # The app is always built for Apple Silicon (aarch64), even on an Intel runner (cross-compilation).
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npm test
          if [ "$(uname -m)" = "arm64" ]; then cd src-tauri && cargo test; else echo "cargo test ignoré (runner Intel, binaire arm64)"; fi

      - name: Build app & dmg
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: MF12-Iris-Studio-macOS-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish release (tags v* ou lancement manuel avec version)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: MF/1.2 Iris Studio ${{ inputs.release_tag || github.ref_name }}
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          body: |
            Application macOS (Apple Silicon). Installation : ouvrir le .dmg, glisser « MF12 Iris Studio » dans Applications.
            Premier lancement : clic droit sur l'app → Ouvrir (application non signée par Apple).
